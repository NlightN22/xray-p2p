[logging]
level = "info"
format = "text"

[client]
server_address = "server.example.com"
server_port = "443"
diag_port = "10085"
user = "alice"
password = "secret"
server_name = "server.example.com"
allow_insecure = false
socks_address = "127.0.0.1:1080"
tun_enabled = true
tun_name = "xp2p0"
tun_mtu = 1500
tun_addr = "10.10.0.2/24"
tun_mode = "split"
dns_servers = ["1.1.1.1", "8.8.8.8"]
full_tunnel_verbose = false
full_tunnel_tag = "primary"

[[client.endpoints]]
profile = "vless-tls-vision"
protocol = "vless"
transport = "tcp"
security = "tls"
flow = "xtls-rprx-vision"
hostname = "server.example.com"
tag = "primary"
address = "203.0.113.10"
port = 443
user = "alice"
password = "secret"
server_name = "server.example.com"
alpn = ["h2", "http/1.1"]
allow_insecure = false
pinned_peer_cert_sha256 = ""
verify_peer_cert_by_name = "server.example.com"

[[client.endpoint_groups]]
group_id = "main"
tag = "main"
members = ["primary"]
mode = "automatic"
failure_threshold = 2
success_threshold = 1
cooldown_seconds = 30
minimum_hold_seconds = 10
automatic_failback = true
manual_active_tag = "primary"

[[client.redirects]]
cidr = "10.20.0.0/16"
outbound_tag = "primary"
access = "restricted"
users = ["alice"]

[client.reverse.work]
channel_id = "work"
user_id = "alice"
host = "10.30.0.10"
tag = "reverse-work"
domain = "work.internal"
endpoint_tag = "primary"

[[client.forwards]]
listen_address = "127.0.0.1"
listen_port = 18080
target_host = "10.30.0.10"
target_port = 80
protocol = "tcp"
tag = "web"
remark = "web forward"

[xray_assets]
stale_after = "24h"

[[xray_assets.files]]
name = "geoip.dat"
url = "https://example.com/geoip.dat"
stale_after = "24h"
