description = "This repository delivers a minimal Trojan tunnel based on **xray-core**."
name = "xray-p2p"

[instructions]
language = "en"
code_language = ["sh", "go"]
coding_style = "minimalistic, concise, without excess"
rules = [
    "all code and comments inside the code must be written in English",
    "try to keep file size under 300 lines; if longer, decompose it",
    "code comments should be minimal, only if necessary for understanding",
    "this is a new project, file and folder names can be changed without backward compatibility control",
    "when renaming files or folders, check dependencies between them",
    "when changing functions inside the lib folder, check dependencies in all files that use them",
    "all new files must use LF line endings",
    "all linux shell scripts must be compatible with OpenWrt and the ash shell",
    "scripts functions duplicated across multiple files must be moved to a separate file in the lib folder and sourced from there",
    "for testing shell scripts, you can use Vagrant; the test environment is located in the infra/vagrant folder",
    "for shell scripts the Vagrant environment scheme is located in infra/vagrant/openwrt/scheme.drawio",
    "for go use common logger for all output",
    "for editing and viewing try to use python, if it's is exist",
    "system services (systemd/procd/Windows SCM) must not rely on CLI flags; packages must run xp2p binaries with default parameters only",
    "terminology: cidr means a network in CIDR format (e.g. 10.0.0.0/24) and must be used for redirect/NAT rules; do not use subnet as a term",
    "terminology: host means a DNS name or IP address of a node/server",
    "terminology: target means a destination in host:port format and is used for forwarding and dns-forward"
]
