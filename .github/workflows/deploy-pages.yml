name: Deploy GitHub Pages (feed + docs)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to update"
        required: true
        default: "both"
        type: choice
        options:
          - docs-only
          - feed-only
          - both

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve baseline Pages content (previous successful deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow deploy-pages.yml --json databaseId,conclusion -L 50 \
            | jq -r '.[] | select(.conclusion=="success") | .databaseId' \
            | head -n 1 || true)"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            if [ "$MODE" != "both" ]; then
              echo "No baseline Pages artifact found; run with mode=both first." >&2
              exit 1
            fi
            rm -rf .pages
            mkdir -p .pages
            exit 0
          fi
          rm -rf .baseline .pages
          mkdir -p .baseline .pages
          if ! gh run download "$run_id" -n github-pages -D .baseline; then
            if [ "$MODE" != "both" ]; then
              echo "Baseline Pages artifact could not be downloaded (expired or missing); run with mode=both to rebuild a clean baseline." >&2
              exit 1
            fi
            echo "Baseline Pages artifact could not be downloaded; continuing with an empty baseline because mode=both." >&2
            rm -rf .baseline .pages
            mkdir -p .pages
            exit 0
          fi
          if [ ! -f ".baseline/artifact.tar" ]; then
            if [ "$MODE" != "both" ]; then
              echo "Baseline artifact.tar not found; refusing to continue." >&2
              exit 1
            fi
            echo "Baseline artifact.tar not found; continuing with an empty baseline because mode=both." >&2
            rm -rf .baseline .pages
            mkdir -p .pages
            exit 0
          fi
          tar -xf .baseline/artifact.tar -C .pages
          rm -f .pages/artifact.tar
          if [ "$MODE" = "docs-only" ] && [ ! -f ".pages/index.html" ]; then
            echo "Baseline Pages content looks incomplete (missing index.html); run with mode=both to rebuild a clean baseline." >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Update docs from latest MkDocs artifact
        if: ${{ inputs.mode == 'docs-only' || inputs.mode == 'both' }}
        uses: dawidd6/action-download-artifact@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-mkdocs.yml
          branch: main
          workflow_conclusion: success
          name: xp2p-docs
          path: .artifacts/docs

      - name: Apply docs update into Pages content
        if: ${{ inputs.mode == 'docs-only' || inputs.mode == 'both' }}
        run: |
          set -euo pipefail
          echo "Docs are applied after feed index generation to avoid index.html cleanup side effects."

      - name: Download .ipk assets from GitHub Release
        if: ${{ inputs.mode == 'feed-only' || inputs.mode == 'both' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .tmp/release-ipks .tmp/inputs
          mkdir -p .tmp/release-ipks .tmp/inputs/openwrt/staging/stable
          mapfile -t tags < <(
            gh release list -L 50 --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft==false) | select(.isPrerelease==false) | .tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          )
          if [ ${#tags[@]} -eq 0 ]; then
            echo "No stable releases found to download .ipk assets from." >&2
            exit 1
          fi
          # Keep a rolling history for the feed (latest 5 stable releases).
          tags=("${tags[@]:0:5}")
          echo "Downloading .ipk assets from releases: ${tags[*]}" >&2
          for t in "${tags[@]}"; do
            gh release download "$t" -p "*.ipk" -D .tmp/release-ipks || true
          done
          shopt -s nullglob
          files=(.tmp/release-ipks/*.ipk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .ipk assets found in the selected releases." >&2
            exit 1
          fi
          mv .tmp/release-ipks/*.ipk .tmp/inputs/openwrt/staging/stable/
          shopt -u nullglob

      - name: Assemble/validate feed into Pages content
        if: ${{ inputs.mode == 'feed-only' || inputs.mode == 'both' }}
        run: |
          set -euo pipefail
          python3 scripts/publish/openwrt_feed.py assemble \
            --manifest openwrt/feed-manifest.yml \
            --inputs-root .tmp/inputs \
            --pages-root .pages \
            --state-dir .tmp/openwrt-feed
          cp -a openwrt/repo/*.pub .pages/ || true

      - name: Install usign
        if: ${{ inputs.mode == 'feed-only' || inputs.mode == 'both' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          git clone https://git.openwrt.org/project/usign.git
          cd usign
          cmake .
          make
          sudo make install

      - name: Restore usign secret key
        if: ${{ inputs.mode == 'feed-only' || inputs.mode == 'both' }}
        run: |
          mkdir -p keys
          echo "${XP2P_USIGN_SECRET}" | base64 -d > keys/xp2p.sec
          chmod 600 keys/xp2p.sec
        env:
          XP2P_USIGN_SECRET: ${{ secrets.XP2P_USIGN_SECRET }}

      - name: Build and sign Packages indexes
        if: ${{ inputs.mode == 'feed-only' || inputs.mode == 'both' }}
        run: |
          set -euo pipefail
          dirs="$(find .pages -type f -name "*.ipk" -print0 | xargs -0 -n1 dirname | sort -u || true)"
          if [ -z "$dirs" ]; then
            echo "No .ipk files found under .pages; refusing to sign empty feed." >&2
            exit 1
          fi
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            bash scripts/build/make_openwrt_packages.sh --path "$dir"
            usign -S -m "$dir/Packages" -s keys/xp2p.sec -x "$dir/Packages.sig"
          done <<< "$dirs"

      - name: Generate feed index pages
        if: ${{ inputs.mode == 'feed-only' || inputs.mode == 'both' }}
        run: bash scripts/build/generate_openwrt_indexes.sh .pages

      - name: Apply docs update into Pages content
        if: ${{ inputs.mode == 'docs-only' || inputs.mode == 'both' }}
        run: |
          set -euo pipefail
          rm -rf .pages/docs
          mkdir -p .pages/docs
          if [ -d ".artifacts/docs/site" ]; then
            cp -a .artifacts/docs/site/. .pages/docs/
          else
            cp -a .artifacts/docs/. .pages/docs/
          fi

      - name: Publish OpenWrt install script
        run: |
          set -euo pipefail
          cp -a openwrt/repo/install-xp2p.sh .pages/install-xp2p.sh
          chmod 755 .pages/install-xp2p.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages
          retention-days: 90

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

