name: aggregate-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.4)"
        required: true
      include_openwrt_ipk:
        description: "Include OpenWrt .ipk files from artifacts branch"
        required: true
        default: true
        type: boolean
      artifacts_mode:
        description: "How to locate build artifacts"
        required: true
        default: "branch"
        type: choice
        options:
          - branch
          - sha
      artifacts_ref:
        description: "Branch name when artifacts_mode=branch"
        required: true
        default: "main"
      release_notes:
        description: "Release notes (raw text)"
        required: false
        default: ""
      release_notes_b64:
        description: "Release notes (base64-encoded UTF-8, optional)"
        required: false
        default: ""

jobs:
  resolve-release-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag SHA
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          sha="$(git rev-parse "refs/tags/${{ inputs.tag }}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  aggregate:
    needs: resolve-release-ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.sha }}
          fetch-depth: 0

      - name: Checkout OpenWrt .ipk staging branch (optional)
        uses: actions/checkout@v4
        with:
          ref: artifacts
          path: openwrt-artifacts
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Resolve tag SHA
        id: ref
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          mode="${{ inputs.artifacts_mode }}"
          ref="${{ inputs.artifacts_ref }}"
          git fetch --tags --force
          if ! git rev-parse "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            echo "Tag not found: $tag" >&2
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          test "$sha" = "${{ needs.resolve-release-ref.outputs.sha }}" || {
            echo "Release tag moved after resource gate resolution" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          prev=""
          mapfile -t tags < <(git tag --list 'v*' --sort=version:refname)
          for i in "${!tags[@]}"; do
            if [ "${tags[$i]}" = "$tag" ]; then
              if [ "$i" -gt 0 ]; then
                prev="${tags[$((i-1))]}"
              fi
              break
            fi
          done
          echo "prev_tag=$prev" >> "$GITHUB_OUTPUT"

          case "$mode" in
            sha)
              value="$sha"
              ;;
            branch)
              value="$ref"
              ;;
            *)
              echo "Invalid artifacts_mode: $mode (expected sha|branch)" >&2
              exit 1
              ;;
          esac
          echo "artifact_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "artifact_value=$value" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from build workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mode="${{ steps.ref.outputs.artifact_mode }}"
          value="${{ steps.ref.outputs.artifact_value }}"
          workflows=("build.yml" "build-msi.yml" "build-deb.yml")
          for wf in "${workflows[@]}"; do
            if [ "$mode" = "sha" ]; then
              run_id=$(gh run list --workflow "$wf" --json databaseId,headSha,conclusion -L 50 \
                | jq -r --arg sha "$value" '.[] | select(.headSha==$sha and .conclusion=="success") | .databaseId' \
                | head -n 1)
            else
              run_id=$(gh run list --workflow "$wf" --branch "$value" --json databaseId,conclusion -L 50 \
                | jq -r '.[] | select(.conclusion=="success") | .databaseId' \
                | head -n 1)
            fi
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              if [ "$mode" = "sha" ]; then
                echo "warning: no successful run found for $wf at $value; falling back to branch=${{ inputs.artifacts_ref }}" >&2
                run_id=$(gh run list --workflow "$wf" --branch "${{ inputs.artifacts_ref }}" --json databaseId,conclusion -L 50 \
                  | jq -r '.[] | select(.conclusion=="success") | .databaseId' \
                  | head -n 1)
              fi
              if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
                if [ "$mode" = "sha" ]; then
                  echo "No successful run found for $wf at $value (or fallback branch ${{ inputs.artifacts_ref }})" >&2
                else
                  echo "No successful run found for $wf on branch $value" >&2
                fi
                exit 1
              fi
            fi
            gh run download "$run_id" -D "artifacts/$wf"
          done

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -print0 | xargs -0 -I {} cp {} release/
          shopt -s nullglob
          ipks=(openwrt-artifacts/openwrt/staging/stable/*.ipk)
          if [ ${#ipks[@]} -gt 0 ]; then
            cp "${ipks[@]}" release/
          else
            if [ "${{ inputs.include_openwrt_ipk }}" = "true" ]; then
              echo "No OpenWrt .ipk files found under openwrt-artifacts/openwrt/staging/stable" >&2
              exit 1
            fi
            echo "warning: no OpenWrt .ipk files found under openwrt-artifacts/openwrt/staging/stable; skipping" >&2
          fi
          shopt -u nullglob
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > SHA256SUMS

      - name: Remove existing release assets (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          existing="$(gh release view "$tag" --json assets -q '.assets[].name' || true)"
          if [ -z "$existing" ]; then
            exit 0
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done < <(find release -maxdepth 1 -type f -print | sort)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          generate_release_notes: false

      - name: Append release notes and OpenWrt feed link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PREV_TAG: ${{ steps.ref.outputs.prev_tag }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          if not event_path:
              raise SystemExit("GITHUB_EVENT_PATH is empty")

          payload = json.loads(pathlib.Path(event_path).read_text(encoding="utf-8"))
          inputs = payload.get("inputs", {}) or {}

          notes_raw = inputs.get("release_notes", "") or ""
          notes_b64 = inputs.get("release_notes_b64", "") or ""
          notes = ""
          if notes_b64:
              import base64
              notes = base64.b64decode(notes_b64).decode("utf-8")
          else:
              notes = notes_raw

          feed = "OpenWrt feed: https://nlightn22.github.io/xray-p2p/"

          repo = os.environ.get("REPO", "").strip()
          tag = os.environ.get("TAG", "").strip()
          prev_tag = os.environ.get("PREV_TAG", "").strip()
          full_changelog = ""
          if repo and tag and prev_tag:
              url = f"https://github.com/{repo}/compare/{prev_tag}...{tag}"
              full_changelog = f"Full Changelog: [{prev_tag}...{tag}]({url})"

          parts = []
          if notes.strip():
              parts.append(notes.strip())
          parts.append(feed)
          if full_changelog:
              parts.append(full_changelog)

          content = "\n\n".join(parts).strip() + "\n"
          with open("release_notes.txt", "w", encoding="utf-8") as handle:
              handle.write(content)
          PY
          gh release edit "$tag" --notes-file release_notes.txt

      - name: Prepare latest artifacts
        id: latest
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          assets=$(go run ./go/tools/targets assets --name "xp2p" --version "$version")
          printf '%s\n' "$assets" > artifacts.tsv
          mkdir -p latest
          while IFS=$'\t' read -r _ release latest; do
            if [ -z "$release" ] || [ -z "$latest" ]; then
              continue
            fi
            cp "release/$release" "latest/$latest"
          done < artifacts.tsv

          if [ -f "release/xp2p-${version}-windows-x86.msi" ]; then
            cp "release/xp2p-${version}-windows-x86.msi" "latest/xp2p-latest-windows-x86.msi"
          fi

          shopt -s nullglob
          for f in release/xp2p_${version}_*.deb; do
            arch="${f##*_}"
            arch="${arch%.deb}"
            cp "$f" "latest/xp2p-latest-linux-${arch}.deb"
          done

          # Keep OpenWrt .ipk assets in "latest" without renaming
          for ipk in release/*.ipk; do
            base="$(basename "$ipk")"
            arch="$(printf '%s' "$base" | sed -nE 's/^.+_[0-9]+\.[0-9]+\.[0-9]+-[0-9]+_(.+)\.ipk$/\1/p')"
            if [ -z "$arch" ]; then
              echo "ERROR: unable to parse arch from ipk name: $base" >&2
              exit 1
            fi
            cp "$ipk" "latest/xp2p-latest-openwrt-${arch}.ipk"
          done
          shopt -u nullglob

          # SHA256SUMS must match renamed "latest" assets
          (
            cd latest
            find . -maxdepth 1 -type f ! -name "SHA256SUMS" -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          latest_paths="$(find latest -maxdepth 1 -type f -print | sort)"
          {
            echo "latest_files<<EOF"
            echo "$latest_paths"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update latest tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          git tag -f latest "${{ steps.ref.outputs.sha }}"
          git push origin latest --force

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release delete latest --yes || true
          args=()
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              args+=("$file")
            fi
          done <<< "${{ steps.latest.outputs.latest_files }}"
          gh release create latest "${args[@]}" \
            --title "Latest" \
            --notes "Automated update for version ${VERSION}" \
            --prerelease
