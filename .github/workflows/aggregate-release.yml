name: aggregate-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.4)"
        required: true
      artifact_ref:
        description: "Git ref to source artifacts (tag, branch, or SHA). Defaults to tag."
        required: false
        default: ""
      release_notes:
        description: "Release notes (raw text)"
        required: false
        default: ""

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag SHA
        id: ref
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          git fetch --tags --force
          if ! git rev-parse "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            echo "Tag not found: $tag" >&2
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          artifact_ref="${{ inputs.artifact_ref }}"
          if [ -z "$artifact_ref" ]; then
            artifact_ref="${GITHUB_REF_NAME}"
          fi
          artifact_sha="$sha"
          if ! git rev-parse "$artifact_ref^{commit}" >/dev/null 2>&1; then
            git fetch --all --prune
          fi
          if ! git rev-parse "$artifact_ref^{commit}" >/dev/null 2>&1; then
            echo "Artifact ref not found: $artifact_ref" >&2
            exit 1
          fi
          artifact_sha="$(git rev-parse "$artifact_ref^{commit}")"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from build workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ steps.ref.outputs.artifact_sha }}"
          workflows=("build.yml" "build-msi.yml" "build-deb.yml")
          for wf in "${workflows[@]}"; do
            run_id=$(gh run list --workflow "$wf" --json databaseId,headSha,conclusion -L 50 \
              | jq -r --arg sha "$sha" '.[] | select(.headSha==$sha and .conclusion=="success") | .databaseId' \
              | head -n 1)
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "No successful run found for $wf at $sha" >&2
              exit 1
            fi
            gh run download "$run_id" -D "artifacts/$wf"
          done

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -print0 | xargs -0 -I {} cp {} release/
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          generate_release_notes: true

      - name: Append release notes and OpenWrt feed link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          notes="${{ inputs.release_notes }}"
          feed="OpenWrt feed: https://nlightn22.github.io/xray-p2p/"
          existing=$(gh release view "$tag" --json body -q .body)
          updated="$existing"
          if [ -n "$notes" ]; then
            updated="${updated}\n\n${notes}"
          fi
          if [ -n "$updated" ]; then
            updated="${updated}\n\n${feed}"
          else
            updated="${feed}"
          fi
          printf "%b" "$updated" > release_notes.txt
          gh release edit "$tag" --notes-file release_notes.txt
