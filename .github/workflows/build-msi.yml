name: build-msi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag, branch, or SHA)"
        required: false
        default: "main"

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check pinned xray assets
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/check_xray_pins.ps1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Determine version
        id: version
        run: |
          $version = (go run ./go/cmd/xp2p --version).Trim()
          if (-not $version) {
            throw "Version not detected"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Build Windows binary
        run: |
          $ldflags = "-s -w -X github.com/NlightN22/xray-p2p/go/internal/version.current=${{ steps.version.outputs.version }}"
          go run ./go/tools/targets build --target windows-amd64 --base build --binary xp2p --pkg ./go/cmd/xp2p --ldflags "$ldflags"

      - name: Build ui-xp2p binary
        run: |
          $uiProject = "dotnet/ui-xp2p/ui-xp2p.csproj"
          if (!(Test-Path $uiProject)) {
            throw "WPF UI project not found at $uiProject"
          }
          $uiPublishDir = "build/windows-amd64/ui-xp2p-publish"
          New-Item -ItemType Directory -Path $uiPublishDir -Force | Out-Null
          dotnet publish $uiProject -c Release -r win-x64 `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            -o $uiPublishDir
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed"
          }
          $publishedExe = Join-Path $uiPublishDir "ui-xp2p.exe"
          if (!(Test-Path $publishedExe)) {
            throw "ui-xp2p publish output missing at $publishedExe"
          }
          Copy-Item -Path $publishedExe -Destination "build/windows-amd64/ui-xp2p.exe" -Force

      - name: Stage xray binary
        run: |
          $sourceDir = "distro/windows/bundle/x86_64"
          $source = Join-Path $sourceDir "xray.exe"
          if (!(Test-Path $source)) {
            throw "xray binary not found at $source"
          }
          $destDir = "build/windows-amd64/bundle"
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          Get-ChildItem -Path $sourceDir -File | Where-Object { $_.Name -ne '.gitkeep' } | ForEach-Object {
            Copy-Item $_.FullName $destDir -Force
          }

      - name: Build MSI
        run: |
          $binary = "build/windows-amd64/xp2p.exe"
          $bundleDir = "build/windows-amd64/bundle"
          $uiBinary = "build/windows-amd64/ui-xp2p.exe"
          $completionDir = "build/windows-amd64/completions"
          $completionOut = Join-Path $completionDir "xp2p.ps1"
          $xray = Join-Path $bundleDir "xray.exe"
          if (!(Test-Path $binary)) {
            throw "xp2p binary not found at $binary"
          }
          if (!(Test-Path $uiBinary)) {
            throw "ui-xp2p binary not found at $uiBinary"
          }
          if (!(Test-Path $xray)) {
            throw "xray binary not found at $xray"
          }
          New-Item -ItemType Directory -Path $completionDir -Force | Out-Null
          & $binary completion powershell | Where-Object { $_ -notmatch '^\d{4}-\d{2}-\d{2}T.*\bxp2p:' } | Set-Content -Path $completionOut -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "xp2p completion powershell failed"
          }
          if (!(Test-Path $completionOut)) {
            throw "PowerShell completion script missing at $completionOut"
          }
          $wixRoot = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter "WiX Toolset*" -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $wixRoot) {
            throw "WiX Toolset installation directory was not found"
          }
          $candle = Join-Path $wixRoot.FullName "bin\\candle.exe"
          $heat = Join-Path $wixRoot.FullName "bin\\heat.exe"
          $light = Join-Path $wixRoot.FullName "bin\\light.exe"
          $wixExt = Join-Path $wixRoot.FullName "bin\\WixUtilExtension.dll"
          $wixUiExt = Join-Path $wixRoot.FullName "bin\\WixUIExtension.dll"
          $bundleWxs = "installer/wix/xp2p-bundle.wxs"
          & $heat dir $bundleDir -dr BinFolder -cg Xp2pBundleGroup -gg -srd -var var.BundleDir -out $bundleWxs
          if ($LASTEXITCODE -ne 0) {
            throw "heat failed"
          }
          $bundleContent = Get-Content -Path $bundleWxs -Raw
          $bundleContent = [regex]::Replace($bundleContent, '<Component\\b(?![^>]*\\bWin64=)', '<Component Win64=\"yes\"', [System.Text.RegularExpressions.RegexOptions]::Singleline)
          Set-Content -Path $bundleWxs -Value $bundleContent
          $wixObj = "installer/wix/xp2p.wixobj"
          $bundleObj = "installer/wix/xp2p-bundle.wixobj"
          $registerPsCompletion = "installer/wix/register_ps_completion.ps1"
          $setServiceAclScript = "installer/wix/set_service_acl.ps1"
          & $candle "-ext" $wixExt "-ext" $wixUiExt "-dProductVersion=${{ steps.version.outputs.version }}" "-dXp2pBinary=$binary" "-dXp2pUiBinary=$uiBinary" "-dBundleDir=$bundleDir" "-dXp2pCompletionScript=$completionOut" "-dRegisterPsCompletionScript=$registerPsCompletion" "-dSetServiceAclScript=$setServiceAclScript" "-out" $wixObj "installer/wix/xp2p.wxs"
          if ($LASTEXITCODE -ne 0) {
            throw "candle failed"
          }
          & $candle "-ext" $wixExt "-ext" $wixUiExt "-dProductVersion=${{ steps.version.outputs.version }}" "-dXp2pBinary=$binary" "-dXp2pUiBinary=$uiBinary" "-dBundleDir=$bundleDir" "-dXp2pCompletionScript=$completionOut" "-dRegisterPsCompletionScript=$registerPsCompletion" "-dSetServiceAclScript=$setServiceAclScript" "-out" $bundleObj $bundleWxs
          if ($LASTEXITCODE -ne 0) {
            throw "candle failed"
          }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $msiPath = "dist/xp2p-${{ steps.version.outputs.version }}-windows-amd64.msi"
          & $light "-ext" $wixExt "-ext" $wixUiExt "-out" $msiPath $wixObj $bundleObj
          if ($LASTEXITCODE -ne 0) {
            throw "light failed"
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp2p-${{ steps.version.outputs.version }}-windows-amd64-msi
          path: dist/xp2p-${{ steps.version.outputs.version }}-windows-amd64.msi
