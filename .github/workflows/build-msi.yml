name: build-msi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag, branch, or SHA)"
        required: false
        default: "main"

jobs:
  msi:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check pinned xray assets
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/check_xray_pins.ps1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Determine version
        id: version
        run: |
          $version = (go run ./go/cmd/xp2p --version).Trim()
          if (-not $version) {
            throw "Version not detected"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Build MSI (amd64, native UI)
        id: msi_amd64
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/build_and_install_msi.ps1 `
            -RepoRoot "$PWD" `
            -CacheDir "$PWD\\build\\msi-cache" `
            -MsiArchLabel "amd64" `
            -BuildOnly `
            -OutputMarker "MSI_PATH="
          $msiPath = ($out | Select-String -Pattern "^MSI_PATH=" | Select-Object -Last 1).Line -replace "^MSI_PATH=", ""
          if (-not $msiPath) { throw "MSI path not found in output" }
          "msi_path=$msiPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build MSI (x86, native UI)
        id: msi_x86
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/build_and_install_msi_x86.ps1 `
            -RepoRoot "$PWD" `
            -CacheDir "$PWD\\build\\msi-cache-x86" `
            -MsiArchLabel "x86" `
            -BuildOnly `
            -OutputMarker "MSI_PATH="
          $msiPath = ($out | Select-String -Pattern "^MSI_PATH=" | Select-Object -Last 1).Line -replace "^MSI_PATH=", ""
          if (-not $msiPath) { throw "MSI path not found in output" }
          "msi_path=$msiPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload MSI artifact (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: xp2p-${{ steps.version.outputs.version }}-windows-amd64-msi
          path: ${{ steps.msi_amd64.outputs.msi_path }}

      - name: Upload MSI artifact (x86)
        uses: actions/upload-artifact@v4
        with:
          name: xp2p-${{ steps.version.outputs.version }}-windows-x86-msi
          path: ${{ steps.msi_x86.outputs.msi_path }}
