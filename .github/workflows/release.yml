name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag, branch, or SHA)"
        required: false
        default: "main"

env:
  RELEASE_NAME: xp2p
  RELEASE_JOB: ${{ vars.RELEASE_JOB || 'all' }} # one of: all, build, msi, deb

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      XP2P_LOG_ROOT: /tmp/xp2p-log
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_job: ${{ env.RELEASE_JOB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Make scripts executable
        run: |
          set -euo pipefail
          find scripts -type f -name "*.sh" -exec chmod +x {} +

      - name: Check pinned xray assets
        run: |
          set -euo pipefail
          ./scripts/ci/check_xray_pins.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME:-}"
          if [ -z "$raw" ]; then
            raw="$(git describe --tags --abbrev=0 || true)"
          fi
          if [ -z "$raw" ]; then
            raw="$(go run ./go/cmd/xp2p --version)"
          fi
          version="${raw#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$raw" >> "$GITHUB_OUTPUT"

      - name: Validate source version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source_version="$(go run ./go/cmd/xp2p --version)"
          if [ "$source_version" != "$VERSION" ]; then
            echo "source version $source_version does not match release version $VERSION"
            exit 1
          fi

      - name: Compute build matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(go run ./go/tools/targets matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: go vet
        run: |
          set -euo pipefail
          go vet ./...

      - name: go test
        run: |
          set -euo pipefail
          go test ./...

      - name: go test (integration)
        run: |
          set -euo pipefail
          go test -tags=integration ./...

  build:
    if: ${{ needs.verify.outputs.release_job == 'all' || needs.verify.outputs.release_job == 'build' }}
    runs-on: ubuntu-latest
    needs: verify
    env:
      XP2P_LOG_ROOT: /tmp/xp2p-log
    outputs:
      version: ${{ needs.verify.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.verify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Make scripts executable
        run: |
          set -euo pipefail
          find scripts -type f -name "*.sh" -exec chmod +x {} +

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          out="dist/${GOOS}-${GOARCH}/xp2p${EXT}"
          mkdir -p "$(dirname "$out")"
          ldflags="-s -w -X github.com/NlightN22/xray-p2p/go/internal/version.current=${VERSION}"
          go build -trimpath -ldflags="$ldflags" -o "$out" ./go/cmd/xp2p

      - name: Stage bundled dependencies
        run: |
          set -euo pipefail
          dest="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          go run ./go/tools/targets deps --target "${{ matrix.goos }}-${{ matrix.goarch }}" --dest "$dest"

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd "dist/${GOOS}-${GOARCH}"
          artifact="../${{ env.RELEASE_NAME }}-${VERSION}-${GOOS}-${GOARCH}.${ARCHIVE}"
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files to package in $(pwd)" >&2
            exit 1
          fi
          if [ "$ARCHIVE" = "zip" ]; then
            zip -j "$artifact" "${files[@]}"
          else
            tar -czf "$artifact" "${files[@]}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-${{ needs.verify.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.RELEASE_NAME }}-${{ needs.verify.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}

  msi:
    if: ${{ needs.verify.outputs.release_job == 'all' || needs.verify.outputs.release_job == 'msi' }}
    runs-on: windows-latest
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check pinned xray assets
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/check_xray_pins.ps1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Build MSI (amd64, native UI)
        id: msi_amd64
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/build_and_install_msi.ps1 `
            -RepoRoot "$PWD" `
            -CacheDir "$PWD\\build\\msi-cache" `
            -MsiArchLabel "amd64" `
            -BuildOnly `
            -OutputMarker "MSI_PATH="
          $msiPath = ($out | Select-String -Pattern "^MSI_PATH=" | Select-Object -Last 1).Line -replace "^MSI_PATH=", ""
          if (-not $msiPath) { throw "MSI path not found in output" }
          "msi_path=$msiPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build MSI (x86, native UI)
        id: msi_x86
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/build_and_install_msi_x86.ps1 `
            -RepoRoot "$PWD" `
            -CacheDir "$PWD\\build\\msi-cache-x86" `
            -MsiArchLabel "x86" `
            -BuildOnly `
            -OutputMarker "MSI_PATH="
          $msiPath = ($out | Select-String -Pattern "^MSI_PATH=" | Select-Object -Last 1).Line -replace "^MSI_PATH=", ""
          if (-not $msiPath) { throw "MSI path not found in output" }
          "msi_path=$msiPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload MSI artifact (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-${{ env.VERSION }}-windows-amd64-msi
          path: ${{ steps.msi_amd64.outputs.msi_path }}

      - name: Upload MSI artifact (x86)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-${{ env.VERSION }}-windows-x86-msi
          path: ${{ steps.msi_x86.outputs.msi_path }}

  deb:
    if: ${{ needs.verify.outputs.release_job == 'all' || needs.verify.outputs.release_job == 'deb' }}
    runs-on: ubuntu-latest
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      XP2P_LOG_ROOT: /tmp/xp2p-log
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Make scripts executable
        run: |
          set -euo pipefail
          find scripts -type f -name "*.sh" -exec chmod +x {} +

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            ruby \
            ruby-dev \
            rpm \
            qemu-user-static \
            binfmt-support \
            pkg-config
          sudo gem install --no-document fpm

      - name: Build deb packages
        run: |
          set -euo pipefail
          export PATH="/usr/local/go/bin:$PATH"
          ./scripts/build/build_deb_xp2p.sh --all

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-${{ env.VERSION }}-deb
          path: build/deb/artifacts/*.deb

  publish:
    if: ${{ needs.verify.outputs.release_job == 'all' }}
    runs-on: ubuntu-latest
    needs:
      - build
      - msi
      - deb
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.RELEASE_NAME }}-${{ env.VERSION }}-*
          path: release
          merge-multiple: true

      - name: Prepare latest artifacts
        id: prepare_latest_artifacts
        run: |
          set -euo pipefail
          assets=$(go run ./go/tools/targets assets --name "${{ env.RELEASE_NAME }}" --version "${VERSION}")
          printf '%s\n' "$assets" > artifacts.tsv
          mkdir -p latest
          while IFS=$'\t' read -r _ release latest; do
            if [ -z "$release" ]; then
              continue
            fi
            cp "release/$release" "latest/$latest"
          done < artifacts.tsv

          release_paths=$(awk -F'\t' '{print "release/" $2}' artifacts.tsv)

          # Include OpenWrt .ipk assets in "latest" with stable names
          shopt -s nullglob
          for ipk in release/*.ipk; do
            base="$(basename "$ipk")"
            arch="$(printf '%s' "$base" | sed -nE 's/^.+_[0-9]+\.[0-9]+\.[0-9]+-[0-9]+_(.+)\.ipk$/\1/p')"
            if [ -z "$arch" ]; then
              echo "ERROR: unable to parse arch from ipk name: $base" >&2
              exit 1
            fi
            cp "$ipk" "latest/xp2p-latest-openwrt-${arch}.ipk"
          done
          shopt -u nullglob

          # SHA256SUMS must match renamed "latest" assets
          (
            cd latest
            find . -maxdepth 1 -type f ! -name "SHA256SUMS" -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          latest_paths="$(find latest -maxdepth 1 -type f -print | sort)"

          {
            echo "release_files<<EOF"
            echo "$release_paths"
            # include deb packages (not part of go/tools/targets assets list)
            find release -maxdepth 1 -name "*.deb" -print
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "latest_files<<EOF"
            echo "$latest_paths"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.prepare_latest_artifacts.outputs.release_files }}
            release/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append pinned xray version to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          pinned=$(python3 -c 'import json; data=json.load(open("go/internal/xray/pinned.json", "r", encoding="utf-8")); print(data.get("version", "").strip())')
          if [ -z "$pinned" ]; then
            echo "Pinned version not found; skipping."
            exit 0
          fi
          existing=$(gh release view "$TAG" --json body -q .body)
          note="Pinned xray version: $pinned"
          if printf '%s' "$existing" | grep -Fq "$note"; then
            exit 0
          fi
          if [ -n "$existing" ]; then
            updated="${existing}\n\n${note}"
          else
            updated="$note"
          fi
          gh release edit "$TAG" --notes "$updated"

      - name: Update latest tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          git tag -f latest "$GITHUB_SHA"
          git push origin latest --force

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --repo "$REPO" || true
          args=()
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              args+=("$file")
            fi
          done <<< "${{ steps.prepare_latest_artifacts.outputs.latest_files }}"
          gh release create latest "${args[@]}" \
            --repo "$REPO" \
            --title "Latest" \
            --notes "Automated update for version ${VERSION}" \
            --prerelease
