name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "schemas/**"
      - "scripts/**"
      - "taplo.toml"
      - "tests/schema/**"
      - "distro/**"
      - "Makefile"
      - "tests/host/linux/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/resource-plateau.yml"
  pull_request:
    paths:
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "schemas/**"
      - "scripts/**"
      - "taplo.toml"
      - "tests/schema/**"
      - "distro/**"
      - "Makefile"
      - "tests/host/linux/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/resource-plateau.yml"

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      XP2P_LOG_ROOT: /tmp/xp2p-log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          set -euo pipefail
          find scripts -type f -name "*.sh" -exec chmod +x {} +

      - name: Check pinned xray assets
        run: |
          set -euo pipefail
          ./scripts/ci/check_xray_pins.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Lint
        run: make lint

      - name: Full Linux Go test suite
        run: |
          set -euo pipefail
          go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pinned xray assets
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/check_xray_pins.ps1
