name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "distro/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "go/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "distro/**"
      - ".github/workflows/ci.yml"

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      XP2P_LOG_ROOT: /tmp/xp2p-log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          set -euo pipefail
          find scripts -type f -name "*.sh" -exec chmod +x {} +

      - name: Check pinned xray assets
        run: |
          set -euo pipefail
          ./scripts/ci/check_xray_pins.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go test
        run: |
          set -euo pipefail
          go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pinned xray assets
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/check_xray_pins.ps1
