name: resource-plateau

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      ref:
        description: Exact commit SHA to verify
        required: true
        type: string
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Resource plateau duration profile
        required: true
        type: choice
        default: nightly
        options:
          - quick
          - nightly
          - soak

concurrency:
  group: resource-plateau-vagrant
  cancel-in-progress: false

jobs:
  linux-host:
    runs-on: [self-hosted, Windows, X64, xp2p-vagrant]
    timeout-minutes: 600
    env:
      XP2P_RESOURCE_PLATEAU_PROFILE: ${{ github.event_name == 'schedule' && 'soak' || inputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}

      - name: Verify checked out commit
        if: github.event_name == 'workflow_call'
        shell: powershell
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "${{ inputs.ref }}") {
              throw "Checked out $actual instead of requested release commit ${{ inputs.ref }}"
          }

      - name: Start Linux test topology
        shell: powershell
        run: make up-deb12

      - name: Run focused Linux resource plateau suite
        shell: powershell
        run: scripts/tests/run_linux_resource_plateau.ps1 -Profile $env:XP2P_RESOURCE_PLATEAU_PROFILE

      - name: Upload resource diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-plateau-${{ github.run_id }}
          path: .logs/tests/
          if-no-files-found: warn

      - name: Halt Linux test topology
        if: always()
        shell: powershell
        run: make halt-deb12
