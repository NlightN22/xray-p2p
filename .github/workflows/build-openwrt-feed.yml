name: Build OpenWrt feed

on:
  push:
    branches:
      - main
    paths:
      - 'openwrt/repo/**'
      - 'scripts/build/generate_openwrt_indexes.sh'
      - '.github/workflows/build-openwrt-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'build-openwrt-feed'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install usign
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          git clone https://git.openwrt.org/project/usign.git
          cd usign
          cmake .
          make
          sudo make install

      - name: Restore usign secret key
        run: |
          mkdir -p keys
          echo "${XP2P_USIGN_SECRET}" | base64 -d > keys/xp2p.sec
          chmod 600 keys/xp2p.sec
        env:
          XP2P_USIGN_SECRET: ${{ secrets.XP2P_USIGN_SECRET }}

      - name: Sign Packages
        run: |
          find openwrt/repo -type f -name Packages | while read pkg; do
            dir=$(dirname "$pkg")
            usign -S -m "$pkg" -s keys/xp2p.sec -x "$dir/Packages.sig"
          done

      - name: Generate index pages
        run: bash scripts/build/generate_openwrt_indexes.sh openwrt/repo

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp2p-feed
          path: ./openwrt/repo
          if-no-files-found: error
          retention-days: 30
