site_name: XP2P Tunnel provider
site_url: https://nlightn22.github.io/xray-p2p/docs/

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          nav_translations:
            Getting Started: Начало работы
            Overview: Обзор
            Terminology: Терминология
            Install: Установка
            First Tunnel (A-B): Первый туннель (A–B)
            Guides (Use Cases): Руководства (сценарии)
            Redirects Within A-B: Редиректы в A–B
            Chain (C2-B-A-C1): Цепочка (C2–B–A–C1)
            Advanced Variants: Продвинутые варианты
            Flows (How It Works): Потоки (как работает)
            Deploy Flow: Поток deploy
            Apply Flow: Поток apply
            Config Compilation: Компиляция конфигурации
            Normalization Pipeline: Пайплайн нормализации
            Tunnel Status Logic: Логика статуса туннеля
            Operations: Эксплуатация
            TUN Setup: Настройка TUN
            Diagnostics & NAT helpers: Диагностика и NAT-хелперы
            Service Control: Управление сервисом
            Backup & Migration: Резервное копирование и миграция
            Shell Completion: Автодополнение shell
            CLI Docs Generation: Генерация CLI-документации
            Reference: Справочник
            Configuration: Конфигурация
            CLI Workflows: CLI-сценарии

nav:
  - Getting Started:
      - Overview: index.md
      - Terminology: getting-started/terminology.md
      - Install: getting-started/install.md
      - First Tunnel (A-B): guides/single-tunnel.md
  - Guides (Use Cases):
      - Redirects Within A-B: guides/redirects.md
      - Chain (C2-B-A-C1): guides/chain.md
      - Advanced Variants: guides/advanced.md
  - Flows (How It Works):
      - Deploy Flow: flows/deploy-flow.md
      - Apply Flow: flows/apply-flow.md
      - Config Compilation: flows/config-compilation.md
      - Normalization Pipeline: flows/normalization-pipeline.md
      - Tunnel Status Logic: flows/tunnel-status.md
  - Operations:
      - TUN Setup: operations/tun-setup.md
      - Server Certificates: operations/server-certificates.md
      - Diagnostics & NAT helpers: operations/diagnostics.md
      - Service Control: operations/service-control.md
      - Backup & Migration: operations/backup-and-migration.md
      - Shell Completion: operations/shell-completion.md
      - CLI Docs Generation: operations/docs-generation.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI Workflows: reference/cli-workflows.md

theme:
  name: material
  logo: https://raw.githubusercontent.com/NlightN22/xray-p2p/main/assets/xp2p_icon.png
  favicon: https://raw.githubusercontent.com/NlightN22/xray-p2p/main/assets/xp2p.ico
  features:
    - content.code.copy
  font:
    text: Merriweather Sans
    code: Roboto Mono
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: blue
      accent: deep purple
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: green
      accent: deep orange

markdown_extensions:
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/lang-active.js

extra_css:
  - stylesheets/mermaid.css
  - stylesheets/lang-active.css
  - stylesheets/code-copy.css
  - stylesheets/code-wrap.css
