services:
  panel:
    image: ghcr.io/mhsanaei/3x-ui:v2.8.11@sha256:ce050d75791a4576c0a5b2fdd207909efa7f88bf6a0a45c5424b949d5fd53432
    container_name: xp2p-3x-ui-v2-8-11
    network_mode: host
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
    volumes:
      - ./state:/etc/x-ui
      - ../../../../../tests/fixtures/tls/integration-cert.pem:/etc/x-ui/fixture-cert.pem:ro
      - ../../../../../tests/fixtures/tls/integration-key.pem:/etc/x-ui/fixture-key.pem:ro
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2053/"]
      interval: 2s
      timeout: 2s
      retries: 30
